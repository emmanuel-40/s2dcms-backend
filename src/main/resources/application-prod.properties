# 
# S2DCMS — PRODUCTION configuration
#   Loaded ONLY when  SPRING_PROFILES_ACTIVE=prod  is set (Render env var).
# 
# This file is COMMITTED to git on purpose. It contains NO secrets. Every
# secret and connection string is a ${ENV_VAR} placeholder that Render fills
# from its environment variables. Render env vars OUTRANK this file, so a
# value set on Render always wins — a secret can never be overridden from here.
#
# Why a file instead of 30 Render env vars?
#   - Non-secret tuning (Hikari pool, AI timeouts, email concurrency, logging)
#     lives here: version-controlled and reviewable, instead of typed into a
#     web UI and silently lost on every rebuild.
#   - Only the secrets/connection strings stay as Render env vars — and you
#     have ALREADY set those (the app runs on them today).
#
# TO ACTIVATE ON RENDER:  add one env var  ->  SPRING_PROFILES_ACTIVE=prod
# 

spring.application.name=S2dcms


# --- DATASOURCE / POSTGRESQL (secret — from Render env) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# --- JPA / HIBERNATE ---
# Flyway owns the schema (V1/V2 migrations), so Hibernate must not alter it.
# ddl-auto=none is the correct, behavior-preserving pairing with Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# --- FLYWAY ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.lock-retry-count=10
logging.level.org.flywaydb=INFO


# --- BREVO TRANSACTIONAL EMAIL (secret — from Render env) ---
# Empty default: a missing key degrades email to a logged failure instead of crashing boot.
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=S2DCMS Support


# --- FRONTEND (used to build links inside emails — from Render env) ---
frontend.base.url=${FRONTEND_BASE_URL:}


# --- JWT / SESSION COOKIES (secret — from Render env) ---
# No default: auth must never silently run on an empty key. If this is unset the
# app SHOULD fail fast at boot with a clear "Could not resolve placeholder" — that
# is the correct outcome for a security-critical value.
jwt.secret=${JWT_SECRET}
jwt.access.expiration=900000
jwt.refresh.expiration=86400000

# SecurityConfig forces SameSite=None; Secure on its own when ENVIRONMENT=production,
# so the values below are only the local fallback and never weaken prod cookies.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false


# --- FILE STORAGE (Supabase — secret from Render env) ---
# Files MUST go to Supabase Storage: Render's disk is wiped on every deploy/cold
# start, so a local file.dir upload would vanish while its DB row survives.
#
file.dir=${FILE_DIR:attachments}
file.max-size=${FILE_MAX_SIZE:5MB}
supabase.storage.url=${SUPABASE_URL:}
supabase.storage.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:s2dcms-uploads}
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_REQUEST_SIZE:30MB}


# --- RATE LIMITING (tuning) ---
limit.max_attempt=4
limit.cooldown_minutes=60


# --- REDIS CACHE (connection from Render env; TTL is tuning) ---
# CacheErrorConfig catches every Redis failure and falls through to Postgres, so an
# unset/blank host degrades caching instead of crashing boot. Empty defaults make a
# missing var non-fatal here.
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
# Set SPRING_DATA_REDIS_SSL_ENABLED=true on Render ONLY if your Redis port is the TLS port.
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.cache.redis.time-to-live=600000


# --- RABBITMQ / CLOUDAMQP (connection from Render env; concurrency is tuning) ---
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10


# --- CONTACT EMAIL inbox (from Render env) ---
admin.email=${ADMIN_EMAIL:}


# --- GROQ AI (secret key from Render env; timeouts are tuning) ---
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7
# Fail fast so a hung provider never holds a Tomcat thread. Code also defaults
# to 5s/15s if these were ever missing, so prod ALWAYS times out.
ai.request.connect-timeout=5s
ai.request.read-timeout=15s


# --- HIKARI CONNECTION POOL (tuning) ---
# ROOT CAUSE of the EMAXCONNSESSION crash: SPRING_DATASOURCE_URL points at Supabase's
# SESSION-mode pooler (port 5432). In session mode every pooled connection is PINNED to
# its own backend session and stays open even when idle — a pool HOARDS instead of shares.
# Supabase's own services already hold part of the 15-session budget, so a pool that opens
# 10+ idle connections leaves ZERO headroom -> Flyway can't grab its one boot connection ->
# "max clients reached in session mode ... pool_size: 15". Supabase pg_stat_activity proved
# it: 15 idle "PostgreSQL JDBC Driver" connections sitting there doing nothing.
#
# Fix part 1 (below): keep the pool tiny and RELEASE idle connections fast (idle-timeout),
# so sessions never pile up and the app self-heals after a burst.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
# Supabase/load balancers drop idle/old connections; recycle before they do so the
# app never hands out a connection the server already closed.
spring.datasource.hikari.max-lifetime=600000

# Fix part 2 (BEST — do this on Render): switch SPRING_DATASOURCE_URL to the TRANSACTION-mode
# pooler (port 6543, same pooler host) and append  ?prepareThreshold=0  to the URL.
# Transaction mode SHARES backends and returns them the instant a query ends, so a pool of 5-10
# uses only a handful of backend sessions total. prepareThreshold=0 disables server-side
# prepared statements, which is MANDATORY in transaction mode (else you get
# "prepared statement ... does not exist" errors). See README "Database connection pooling".


# --- LOGGING (production-friendly: no verbose SQL in prod) ---
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
