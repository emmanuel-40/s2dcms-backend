
# S2DCMS — example configuration
# ------------------------------------------------------------------
# Copy this file to  src/main/resources/application.properties  and replace
# every YOUR_... placeholder. The real application.properties is git-ignored,
# so no credential ever reaches GitHub.
#
# Any property can be overridden with an upper-case environment variable
# (Spring relaxed binding), which is how production is configured on Render:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#   SPRING_DATA_REDIS_HOST / _PORT / _PASSWORD,
#   SPRING_RABBITMQ_HOST / _PORT / _USERNAME / _PASSWORD,
#   SPRING_AI_OPENAI_API_KEY, BREVO_API_KEY, BREVO_SENDER_EMAIL,
#   ADMIN_EMAIL, JWT_SECRET
# Set ENVIRONMENT=production to send session cookies as SameSite=None; Secure
# (required when the Vercel frontend calls this API cross-origin).
# ------------------------------------------------------------------

# APPLICATION

spring.application.name=S2dcms


# DATASOURCE / POSTGRESQL

# Optional: override with SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/YOUR_DATABASE_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:YOUR_DB_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YOUR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# HIBERNATE / JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# FLYWAY

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.lock-retry-count=10

logging.level.org.flywaydb=INFO


# SMTP (OPTIONAL LOCAL TESTING)

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# BREVO API CONFIG

brevo.api.key=YOUR_BREVO_API_KEY
brevo.sender.email=YOUR_EMAIL@example.com
brevo.sender.name=S2DCMS Support


# FRONTEND

frontend.base.url=http://localhost:5173


# JWT / SESSION COOKIES
# Access token lives 15 min, refresh token 24 h (values in milliseconds).
# Tokens travel ONLY as HttpOnly cookies — the API never returns them in a body.
# jwt.secret must be at least 32 characters; in production set JWT_SECRET instead.

jwt.secret=YOUR_SUPER_SECRET_KEY
jwt.access.expiration=900000
jwt.refresh.expiration=86400000

# Session cookie flags. SecurityConfig raises SameSite/Secure on its own when
# ENVIRONMENT=production, so secure stays false for local http:// development.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false


# FILE STORAGE

# Where uploads are written when Supabase Storage is NOT configured (dev/tests only).
# WARNING: never rely on this in production - Render's container filesystem is destroyed on
# every deploy and free-tier cold start, so uploaded files disappear while the database rows
# pointing at them survive.
file.dir=attachments
file.max-size=5MB

# SUPABASE STORAGE (required in production - set these on Render)
# Create a PUBLIC bucket first: Dashboard -> Storage -> New bucket.
# The service_role key bypasses row-level security, so it must only ever live on the server
# (Render environment variable). Never commit it and never expose it to the SPA.
# Project Settings -> API -> Project URL / service_role key
supabase.storage.url=${SUPABASE_URL:}
supabase.storage.service-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:s2dcms-uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


# RATE LIMITING

limit.max_attempt=4
limit.cooldown_minutes=60


# REDIS CACHE

spring.cache.type=redis

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Cache expires automatically after 10 minutes
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.cache.redis.time-to-live=600000

# RABBITMQ CONFIGURATION
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# CloudAMQP and other hosted brokers use "/" for a single vhost; without this the client
# defaults to "/" too, but setting it explicitly avoids surprises with custom vhost names.
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=10

# CONTACT EMAIL
# Inbox that receives landing-page contact-form submissions
admin.email=YOUR_ADMIN_EMAIL@example.com

# GROQ AI CONFIGURATION (OpenAI-compatible chat completions endpoint)
# Get a key at https://console.groq.com/ ; in production set
# SPRING_AI_OPENAI_API_KEY instead of pasting the key into a file.
spring.ai.openai.api-key=YOUR_GROQ_API_KEY
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
spring.ai.openai.chat.options.temperature=0.7

# REDIS SSL (managed providers)
# Redis Cloud and most managed Redis services require TLS. Uncomment when your
# provider's port is SSL-only (e.g. Redis Cloud's 18xxx port).
# spring.data.redis.ssl.enabled=true
