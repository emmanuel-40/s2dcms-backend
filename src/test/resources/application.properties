# =====================================================================
# TEST CONFIGURATION
# Self-contained: the test context must boot without PostgreSQL, Redis,
# RabbitMQ, Brevo or any AI provider being reachable.
# =====================================================================
spring.application.name=d2scrms-test

# ---------- Database: H2 in-memory, schema generated from entities ----------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migrations are PostgreSQL specific -> schema comes from entities here
spring.flyway.enabled=false
spring.h2.console.enabled=false

# ---------- Caching: no Redis needed ----------
spring.cache.type=none
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---------- Messaging: never connect to a broker in tests ----------
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# ---------- Mail: stubbed, nothing is ever sent ----------
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ---------- JWT (HS256 needs a >= 32 byte secret) ----------
jwt.secret=TestOnlySuperSecretKeyForS2dcmsTestsPleaseIgnore123!
jwt.access.expiration=900000
jwt.refresh.expiration=86400000

# ---------- Login rate limiting: keep it out of the way for tests ----------
limit.max_attempt=1000
limit.cooldown_minutes=60

# ---------- Uploads ----------
# Left unconfigured on purpose so tests exercise the local-disk branch and never call
# Supabase. The absolute-URL branch is covered by SupabaseStorageServiceTest instead.
file.dir=target/test-uploads
file.max-size=5MB
supabase.storage.url=
supabase.storage.service-key=
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------- Remaining placeholders resolved by @Value / @ConfigurationProperties ----------
admin.email=admin@test.com
frontend.base.url=http://localhost:5173
brevo.api.key=test-brevo-api-key
brevo.sender.email=test@test.com
brevo.sender.name=S2DCMS Test

# ---------- AI: beans are created but never called ----------
spring.ai.openai.api-key=test-api-key
spring.ai.openai.base-url=http://localhost:1
spring.ai.openai.chat.options.model=test-model

logging.level.root=WARN
logging.level.org.hibernate.SQL=WARN

